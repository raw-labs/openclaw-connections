name: Install pinned toolchain
description: Install the repository's Node, pnpm and locked dependencies
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24.19.0
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # Bound the full process tree, including native declaration children, and
    # keep compiler process groups separate from the Actions runner.
    - run: |
        free -m
        df -h .
        sdk_builder="connections-sdk-builder:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        sdk_container="connections-sdk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        docker build --file .github/actions/setup/Dockerfile \
          --build-arg "CONNECTIONS_BUILD_UID=$(id -u)" \
          --build-arg "CONNECTIONS_BUILD_GID=$(id -g)" \
          --tag "$sdk_builder" .github/actions/setup
        if docker run --init --name "$sdk_container" \
          --memory=5g --memory-swap=5g \
          --env OPENCLAW_TSDOWN_MAX_OLD_SPACE_MB \
          --volume "$PWD:$PWD" --workdir "$PWD" \
          "$sdk_builder" node scripts/prepare-host.mjs; then
          sdk_exit=0
        else
          sdk_exit=$?
        fi
        docker inspect --format 'SDK compiler OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' "$sdk_container"
        docker rm "$sdk_container"
        exit "$sdk_exit"
      shell: bash
      env:
        OPENCLAW_TSDOWN_MAX_OLD_SPACE_MB: "4352"
    - run: pnpm exec playwright install --with-deps chromium
      shell: bash
