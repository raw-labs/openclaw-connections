name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    # RAW Labs uses Depot; leave headroom for the native SDK declaration compiler.
    runs-on: depot-ubuntu-24.04-arm-8
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test:native
      - run: pnpm inspect:package
      - run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installable-package
          path: .local/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
