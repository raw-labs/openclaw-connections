name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to finish publishing; leave empty for Release Please
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: inputs.tag == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Bot-created PRs can omit CI or await maintainer approval. Dispatch checks
      # each head branch; approve a pending original PR run after reviewing its
      # diff so its required verify check can run (see RELEASING.md).
      - name: Validate release PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --label 'autorelease: pending' --json headRefName --jq '.[].headRefName' |
          while IFS= read -r branch; do
            gh workflow run ci.yml --ref "$branch"
          done
  publish:
    needs: release
    if: ${{ !cancelled() && (needs.release.outputs.created == 'true' || inputs.tag != '') }}
    # Match the qualified runner and retain memory headroom for SDK declarations.
    runs-on: macos-15-intel
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || needs.release.outputs.tag }}
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test:native
      - run: pnpm inspect:package
      - run: git diff --exit-code
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.release.outputs.tag }}
        run: node -e 'if (process.env.RELEASE_TAG !== `v${require("./package.json").version}`) process.exit(1)'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          registry-url: https://npm.pkg.github.com
          scope: "@raw-labs"
      - name: Publish verified tarball
        run: |
          version=$(node -p 'require("./package.json").version')
          mkdir -p .local/registry
          if npm pack "@raw-labs/openclaw-connections@$version" --json --pack-destination .local/registry > .local/registry-result.json; then
            cmp .local/*.tgz .local/registry/*.tgz
          else
            # npm reports E404 for a missing package, ETARGET for a missing
            # version of an existing package. Auth/transport failures stay fatal.
            node -e 'if (!["E404", "ETARGET"].includes(require("./.local/registry-result.json").error?.code)) process.exit(1)'
            npm publish .local/*.tgz
          fi
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Verify private package and registry artifact
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          gh api "orgs/${GITHUB_REPOSITORY_OWNER}/packages/npm/openclaw-connections" |
          jq --exit-status '.visibility == "private"'
          version=$(node -p 'require("./package.json").version')
          # The npm source link comes from registry package metadata, not the
          # optional repository object in GitHub's generic Packages response.
          npm view "@raw-labs/openclaw-connections@$version" repository.url --json > .local/published-repository.json
          node -e 'const url = require("./.local/published-repository.json"); if (typeof url !== "string" || url.replace(/^git\+/, "").replace(/\.git$/, "") !== `https://github.com/${process.env.GITHUB_REPOSITORY}`) process.exit(1)'
          mkdir -p .local/registry
          npm pack "@raw-labs/openclaw-connections@$version" --pack-destination .local/registry
          cmp .local/*.tgz .local/registry/*.tgz
      - name: Attach installable release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || needs.release.outputs.tag }}
        run: |
          archives=(.local/*.tgz)
          archive=${archives[0]}
          name=$(basename "$archive")
          gh release view "$RELEASE_TAG" --json assets > .local/release-assets.json
          if node -e 'if (!require("./.local/release-assets.json").assets.some(asset => asset.name === process.argv[1])) process.exit(1)' "$name"; then
            mkdir -p .local/release
            gh release download "$RELEASE_TAG" --pattern "$name" --dir .local/release
            cmp "$archive" ".local/release/$name"
          else
            gh release upload "$RELEASE_TAG" "$archive"
          fi
